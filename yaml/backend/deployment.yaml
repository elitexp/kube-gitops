apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-backend 
  template:
    metadata:
      labels:
        app: guestbook-backend
    spec:
      containers:
      - image: openlabfree/globomantics-be:v7
        imagePullPolicy: Always
        name: guestbook-backend
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: mongodb-host
        - name: MONGODB_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: mongodb-db-name   
        - name: MONGODB_DB_PARAM
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: mongodb-db-param         
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: guestbook-backend-secret
              key: mongodb-username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guestbook-backend-secret
              key: mongodb-password
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: s3-endpoint
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: s3-bucket
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: s3-region
        - name: S3_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: guestbook-backend-config
              key: s3-use-ssl
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: guestbook-backend-secret
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: guestbook-backend-secret
              key: s3-secret-key
