apiVersion: v1
kind: Service
metadata:
  labels:
    name: minio
  name: minio
spec:
  type: ClusterIP
  ports:
    - name: api
      protocol: "TCP"
      port: 9000
      targetPort: 9000
    - name: console
      protocol: "TCP"
      port: 9001
      targetPort: 9001
  selector:
    app: minio

