name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker image
        run: |
          docker build \
            --build-arg MODE=prod \
            -t ghcr.io/${{ github.repository_owner }}/globomantics-hotel-backend:${{ env.IMAGE_TAG }} \
            ./app/backend

      - name: Build Frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/globomantics-hotel-frontend:${{ env.IMAGE_TAG }} \
            ./app/frontend

      - name: Push Backend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/globomantics-hotel-backend:${{ env.IMAGE_TAG }}

      - name: Push Frontend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/globomantics-hotel-frontend:${{ env.IMAGE_TAG }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # container:
    #   image: registry.k8s.io/kustomize/kustomize:v5.0.0  
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
      
      - name: Install kustomize (official script)
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Checkout devops repository
        env:
          PAT: ${{ secrets.CI_BOT_PAT }}
          CI_BOT: ${{ secrets.CI_BOT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/elitexp/kube-gitops-ci-cd.git develop
          cd kube-gitops-ci-cd
          git config user.name "ci-bot"
          git config user.email "$CI_BOT"
          git fetch origin develop
          git checkout develop


      - name: Update Kustomize image
        env:
          PAT: ${{ secrets.CI_BOT_PAT }}
        run: |
          cd apps/globomantics-hotel/overlays/dev
          kustomize edit set image openlabfree/globomantics-fe:v4=ghcr.io/${{ github.repository_owner }}/globomantics-hotel-frontend:${IMAGE_TAG}
          kustomize edit set image openlabfree/globomantics-be:v7=ghcr.io/${{ github.repository_owner }}/globomantics-hotel-backend:${IMAGE_TAG}
          git add .
          git commit -m "Update globomantics-hotel backend and frontend images to ${IMAGE_TAG}"
          git push https://x-access-token:${PAT}@github.com/elitexp/kube-gitops-ci-cd.git develop