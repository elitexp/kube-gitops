name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg MODE=prod \
            -t ghcr.io/${{ github.repository_owner }}/globomantics-hotel:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}globomantics-hotel:${{ env.IMAGE_TAG }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # container:
    #   image: registry.k8s.io/kustomize/kustomize:v5.0.0  
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
      
      - name: Install kustomize (official script)
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
      - name: Checkout devops repository
        env:
          PAT: ${{ secrets.CI_BOT_PAT }}
          CI_BOT: ${{ secrets.CI_BOT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/cloud-native-nepal/central-ci.git develop
          cd aleo-devops
          git config user.name "ci-bot"
          git config user.email "$CI_BOT"
          git fetch origin develop
          git checkout develop


      - name: Update Kustomize image
        env:
          PAT: ${{ secrets.CI_BOT_PAT }}
        run: |
          cd cloud-native-nepal/central-ci/overlays/dev
          kustomize edit set image globomantics-hotel=ghcr.io/${{ github.repository_owner }}/globomantics-hotel:${IMAGE_TAG}
          git add .
          git commit -m "Update globomantics-hotel image to ${IMAGE_TAG}"
          git push https://x-access-token:${PAT}@github.com/cloud-native-nepal/central-ci.git develop