<p></p>
<mat-card class="mat-elevation-z8">
  
  <mat-card-content>
    <mat-form-field>
      <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
    </mat-form-field>

    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <!-- Message Column -->
        <ng-container matColumnDef="message">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Message </th>
          <td mat-cell *matCellDef="let row"> {{row.message}} </td>
        </ng-container>

        <!-- Visiting Card Column -->
        <ng-container matColumnDef="visitingCard">
          <th mat-header-cell *matHeaderCellDef> Visiting Card </th>
          <td mat-cell *matCellDef="let row">
            <div *ngIf="row.visitingCard" style="display: flex; align-items: center; gap: 8px;">
              <img [src]="row.visitingCard.fileUrl" 
                   alt="Visiting Card" 
                   style="max-width: 80px; max-height: 80px; cursor: pointer; border-radius: 4px;"
                   (click)="openImage(row.visitingCard.fileUrl)"
                   title="Click to view full size">
              <button mat-icon-button 
                      color="primary" 
                      (click)="downloadVisitingCard(row.visitingCard)"
                      matTooltip="Download visiting card"
                      style="margin-left: 4px;">
                <mat-icon>download</mat-icon>
              </button>
            </div>
            <span *ngIf="!row.visitingCard" style="color: #999;">-</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;">
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
<p></p>

<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <mat-card-title>Leave your feedback !</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form #myform="ngForm" (ngSubmit)="myform.valid && onSubmit(myform)" novalidate>
    <div class="newentry-container">
      <mat-form-field>
        <input required name="name" [(ngModel)]="name" ngModel matInput placeholder="Your name">
      </mat-form-field>

      <mat-form-field>
        <textarea matInput name="message"[(ngModel)]="message" ngModel placeholder="Your guestbook message"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary">Leave message</button>

    </div>
  </form>
  </mat-card-content>
</mat-card>
<p></p>
<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <mat-card-title>Visiting Cards</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="mat-elevation-z8" *ngIf="visitingCardDataSource">
      <table mat-table [dataSource]="visitingCardDataSource" matSort>
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <!-- Message Column -->
        <ng-container matColumnDef="message">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Message </th>
          <td mat-cell *matCellDef="let row"> {{row.message}} </td>
        </ng-container>

        <!-- Visiting Card Column -->
        <ng-container matColumnDef="visitingCard">
          <th mat-header-cell *matHeaderCellDef> Visiting Card </th>
          <td mat-cell *matCellDef="let row">
            <img [src]="row.fileUrl" alt="Visiting Card" style="max-width: 150px; max-height: 150px; cursor: pointer;" (click)="openImage(row.fileUrl)">
          </td>
        </ng-container>

        <!-- Uploaded At Column -->
        <ng-container matColumnDef="uploadedAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Uploaded At </th>
          <td mat-cell *matCellDef="let row"> {{row.uploadedAt | date:'short'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="visitingCardColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: visitingCardColumns;">
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
<p></p>
<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <mat-card-title>Upload Your Visiting Card</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form #visitingCardForm="ngForm" (ngSubmit)="visitingCardForm.valid && onSubmitVisitingCard(visitingCardForm)" novalidate>
    <div class="newentry-container">
      <mat-form-field>
        <input name="visitingCardName" [(ngModel)]="visitingCardName" ngModel matInput placeholder="Your name">
      </mat-form-field>

      <mat-form-field>
        <textarea matInput name="visitingCardMessage" [(ngModel)]="visitingCardMessage" ngModel placeholder="Optional message"></textarea>
      </mat-form-field>

      <input type="file" id="visitingCardInput" accept="image/*" (change)="onFileSelected($event)" style="margin-bottom: 16px;">
      <div *ngIf="selectedFile" style="margin-bottom: 16px;">
        <p>Selected file: {{selectedFile.name}}</p>
      </div>

      <button mat-raised-button color="accent" type="submit">Upload Visiting Card</button>

    </div>
  </form>
  </mat-card-content>
</mat-card>
